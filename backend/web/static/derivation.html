<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推导关系图 · DCF</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 图与侧栏并排：图上点一行，侧栏给出它的凭证和改动框。窄窗口叠成一列。 */
  .layout { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:14px; align-items:start; }
  @media (max-width:1100px) { .layout { grid-template-columns: minmax(0,1fr); } }
  /* 高度按视口算，不留 max-height 那种「小窗只剩 89px 可视」的写法：图本来就要靠拖拽看全。 */
  .graph-scroll { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; height:calc(100vh - var(--header-h) - 210px); min-height:340px; cursor:grab; }
  .graph-scroll.grabbing { cursor:grabbing; user-select:none; }
  svg { display:block; }
  .col-title { fill:var(--muted); font-size:11px; font-weight:600; }
  .col-rule { stroke:var(--line); stroke-dasharray:2 3; }
  .edge { stroke:#c3c8d1; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
  /* 虚线边＝这条推导只在建链那一刻算过一次，改它的上游不会回头改这一格（写在 .edge.hot 之前，
     让高亮时仍换成主色，只保留花型）。 */
  .edge.build-only { stroke:#dcdee6; stroke-dasharray:4 3; }
  .edge.hot { stroke:var(--accent); stroke-width:1.7; }
  .node { cursor:pointer; }
  .node rect.box { fill:#fff; stroke:var(--line); }
  .node text { font-size:12px; fill:#15181e; }
  .node .v { font-size:11px; fill:#4a5058; font-variant-numeric:tabular-nums; }
  .node .f { font-size:10px; fill:#7a828c; }
  .node:hover rect.box { stroke:var(--accent); }
  .node.edited rect.box { fill:#fff8e6; stroke:#c2410c; }
  .node.derived rect.box { stroke:var(--accent); stroke-dasharray:3 2; }
  .node.engine rect.box { stroke:#dc2626; stroke-dasharray:3 2; }
  .node.engine text { fill:#3f1214; }
  .node.ref rect.box { fill:#f7f8fa; }
  .node.ref text { fill:#5b616b; }
  .node.selected rect.box { stroke:var(--accent); stroke-width:2; }
  /* 「变暗」得看得见：整图是这张页的全貌，淡到 0.15 就等于把它擦了——读的人分不清是隐藏还是没画。
     节点留四成（字还认得出），连线留三成（再亮就和 hot 那条分不开）。 */
  .node.fade { opacity:.4; }
  .edge.fade { opacity:.3; }
  .detail { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; position:sticky; top:calc(var(--header-h) + 12px); }
  .detail h3 { margin:0 0 2px; font-size:14px; }
  .detail .row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding:4px 0; font-size:12px; }
  .detail .row span:first-child { color:var(--muted); }
  .detail .why { font-size:12px; color:#39404a; margin:8px 0; }
  .detail .formula { background:#f7f8fa; border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:12px; line-height:1.55; margin:8px 0; word-break:break-all; white-space:pre-wrap; }
  .detail .formula b { color:#39404a; }
  .detail .link { color:var(--accent); cursor:pointer; }
  .detail .editor { border-top:1px solid var(--line); padding-top:9px; margin-top:6px; }
  .detail .editor > span.muted { font-size:12px; color:var(--muted); }
  .detail .years { display:grid; grid-template-columns:auto 1fr auto; gap:4px 6px; align-items:center; margin:6px 0; }
  .detail .years span { font-size:11px; color:var(--muted); }
  .detail input.num { width:110px; }
  .detail button { margin:6px 0 0; }
  .detail table.series { width:100%; font-size:11px; margin:6px 0; }
  .detail table.series th, .detail table.series td { padding:2px 4px; text-align:right; }
  /* 放大一条链＝页内模态浮层：只装这一条链（链尾 + 上游两层），上面重画这条链的小图、下面摊推导过程。
     背景整图与侧栏原地不动，只是被浮层压住；Esc 与「← 返回整图」都回到原处。
     浮层里一个输入框都不建——改数回整图或面板，「写入只有那两条通路」不因多一个视图而分叉。 */
  .hide { display:none !important; }
  .overlay { position:fixed; inset:0; z-index:40; overflow:auto; background:rgba(18,22,30,.52); padding:20px 14px 30px; }
  .modal { position:relative; max-width:1160px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 16px 44px rgba(16,20,28,.34); padding:14px 18px 8px; }
  /* 小图只画链上那几行：栏＝距链尾几跳（链尾在最右，越左越原始），所以这一张图里没有「别的链」。 */
  .chain-graph { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; margin:0 0 12px; }
  .cnode { cursor:pointer; }
  .cnode rect { fill:#fff; stroke:var(--line); }
  .cnode text { font-size:12px; fill:#15181e; }
  .cnode .v { font-size:11px; fill:#4a5058; font-variant-numeric:tabular-nums; }
  .cnode .f { font-size:10px; fill:#7a828c; }
  .cnode:hover rect { stroke:var(--accent); }
  .cnode.tail rect { stroke:var(--accent); stroke-width:2; }
  .cedge { stroke:#c3c8d1; stroke-width:1.3; fill:none; marker-end:url(#carrow); }
  .cedge.build-only { stroke:#dcdee6; stroke-dasharray:4 3; }
  .ccol { fill:var(--muted); font-size:11px; font-weight:600; }
  .chain-bar { display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .chain-bar button { margin:0; }
  .chain-tail { display:flex; align-items:baseline; gap:6px 14px; flex-wrap:wrap; }
  .chain-tail b { font-size:24px; font-variant-numeric:tabular-nums; }
  .chain-note { font-size:12px; color:var(--muted); margin:0 0 14px; }
  .step { border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:0 0 16px; }
  .step.tail { border-left-color:var(--accent); }
  .step h4 { margin:0; font-size:13px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .step h4 .idx, .step h4 .k { color:var(--muted); font-weight:400; font-size:11px; }
  .step .expr { background:#f7f8fa; border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px; line-height:1.6; margin:6px 0; word-break:break-all; white-space:pre-wrap; }
  .step .expr b { color:#39404a; }
  .step .expr.sub { background:#eef3ff; border-color:#b5c8ee; }
  .step .cells { display:flex; flex-wrap:wrap; gap:4px 6px; margin:6px 0; }
  .step .cells span { font-size:11px; background:#fff; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-variant-numeric:tabular-nums; }
  .step p { font-size:12px; color:#39404a; margin:6px 0; }
  .step button.mag { font-size:11px; padding:1px 6px; margin:0; }
  .chain table.series { width:100%; font-size:11px; margin:6px 0; border-collapse:collapse; }
  .chain table.series th, .chain table.series td { padding:2px 6px; text-align:right; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font-size:12px; color:var(--muted); }
  .swatch { display:inline-block; width:12px; height:12px; border:1px solid var(--line); border-radius:3px; vertical-align:-2px; margin-right:4px; }
</style>
</head>
<body>
<header>
  <h1>推导关系图</h1>
  <a class="navlink" href="/">首页</a>
  <label>代码 <input id="code" size="9" list="codes" placeholder="600519" autocomplete="off" spellcheck="false"></label>
  <datalist id="codes"></datalist>
  <label>取数批次 <select id="run"></select></label>
  <label>市场基准 <select id="benchmark"></select></label>
  <button id="fetch" title="联网取数并重画这张图（约数十秒）；数据仍在有效期内时后台只复现快照，不联网；A 股名录里没有的代码直接拒，一次网都不上">取数估值</button>
  <button id="refetch" hidden title="跳过新鲜度判断，联网重取一份新凭证">强制重取</button>
  <span id="freshness" class="muted"></span>
  <label>ERP 窗口 <select id="erpwindow"></select></label>
  <label>口径 <select id="method"><option value="fcff">FCFF</option><option value="fcfe">FCFE</option></select></label>
  <label>终值 <select id="terminal"><option value="gordon">Gordon</option><option value="exit_multiple">退出倍数</option><option value="uem">UEM</option></select></label>
  <label>折现率 <input id="rate" size="5" placeholder="级联"></label>
  <label>缩放 <select id="zoom" title="「适配窗口」只保证竖向装得下（每一带的行高全部可见），横向本来就靠拖拽看全图"><option value="fit">适配窗口</option><option value="0.7">很小</option><option value="0.85">小</option><option value="1" selected>中</option><option value="1.3">大</option></select></label>
  <button id="reset" title="丢掉本页未保存的改动，回到机器基线">清空修正</button>
  <button id="save" title="写入这一批次的 manual.json——与面板同一份文件">保存修正</button>
  <a class="navlink" id="panel-link" href="#">逐行表格视图</a>
  <span id="status" class="muted"></span>
</header>
<main>
  <div class="cards" id="summary"></div>
  <div id="notices"></div>
  <div class="layout" id="board">
    <div class="graph-scroll" id="graph-scroll"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside class="detail" id="detail"></aside>
  </div>
  <div class="legend" id="legend"></div>
</main>
<!-- 放大一条链＝页内模态浮层：背后那张整图原地不动，浮层里只装这一条链（链尾 + 上游两层），
     上面重画这条链的小图、下面摊推导过程。Esc 或「← 返回整图」回到整图并停在同一行。 -->
<div class="overlay hide" id="chain-overlay">
  <div class="modal chain" id="chain"></div>
</div>
<script src="/assets/common.js"></script>
<script>
const state = { code: "", run: "", nodes: {}, order: [], edges: [], columns: 0, slots: 0, roots: [], skeleton: null, overrides: {}, att: {}, data: null, seq: 0, selected: "", chain: "", trail: [] };
let geo = { nodeW: 208, nodeH: 58, stepX: 250, pad: 20, zoom: 1 };

const LAYER_TITLES = ["原始取数／惯例值", "一步推导", "两步推导", "三步及以上"];
const GROUP_COLOR = {
  revenue: "#2563eb", profitability: "#0891b2", reinvestment: "#059669", capital_structure: "#ca8a04",
  discount_rate: "#7c3aed", terminal: "#db2777", market: "#64748b", valuation: "#dc2626",
};
// 节点放四行（名称／值／公式两行），所以比原来宽也高；列间距反而收窄——横向本来就要拖拽看。
const BASE = { nodeW: 232, nodeH: 64, gapX: 40, gapY: 14, pad: 20, head: 26 };
// 最左列堆 28 行是这个图最挤的地方：超过这个数就把该列拆成并排的几条带，纵向换横向。
const MAX_STACK = 9;

const clip = (text, max) => (text.length > max ? text.slice(0, Math.max(1, max - 1)) + "…" : text);

// 公式在图上折两行放得下，第三行起省略——完整式子写进 <title> 与侧栏，节点只负责认得出是哪一步。
function wrap(text, max, lines = 2) {
  if (!text) return [];
  const out = [];
  let rest = String(text);
  while (rest && out.length < lines) {
    if (rest.length <= max && out.length === lines - 1) { out.push(rest); rest = ""; break; }
    out.push(rest.slice(0, max));
    rest = rest.slice(max);
  }
  if (rest) out[out.length - 1] = clip(out[out.length - 1] + rest, max);
  return out;
}

// ---------------------------------------------------------------- 合成：假设链骨架 ＋ 估值段
// 骨架来自 /api/derivation（同一份 baseline.json 永远画同样的线），估值段的值来自面板同一个
// /api/recompute。所以「图上改数」与「面板改数」不是两套语义：同一份 overrides、同一份 manual.json。
let bandDepth = new Map();   // 每次合成重算：换口径／终值时长得不一样的两段不能共用上一次的深度
let bandKey = "";            // 估值段的形状：只写值不换形状时不必重画整张图

function compose(valuation) {
  const base = state.skeleton;
  if (!base) return false;
  bandDepth = new Map();
  const nodes = {};
  for (const raw of base.nodes) {
    nodes[raw.key] = { ...raw, upstream: [...raw.upstream], downstream: [...raw.downstream] };
  }
  const band = (valuation && valuation.nodes) || [];
  const inBand = new Set(band.map((node) => node.key));
  band.forEach((raw, index) => {
    // 段内深度＝段内最长上游链；整段再整体平移到假设链右边，列号仍然只由依赖深度决定。
    const inside = (raw.upstream || []).filter((key) => inBand.has(key));
    const depth = inside.length ? 1 + Math.max(...inside.map((key) => bandDepth.get(key))) : 0;
    bandDepth.set(raw.key, depth);
    const node = {
      ...raw, upstream: (raw.upstream || []).filter((key) => nodes[key] || inBand.has(key)),
      downstream: [], layer: base.columns + depth, order: 1000 + index, band: true,
    };
    nodes[raw.key] = node;
    for (const source of node.upstream) nodes[source].downstream.push(raw.key);
  });
  state.nodes = nodes;
  state.order = Object.values(nodes).sort((a, b) => a.layer - b.layer || a.order - b.order).map((node) => node.key);
  state.edges = state.order.flatMap((key) => nodes[key].upstream.map((source) => ({ from: source, to: key })));
  state.columns = Math.max(0, ...Object.values(nodes).map((node) => node.layer + 1));
  // 形状＝「有哪些步、每步接谁」。换口径（FCFF↔FCFE）或换终值时步骤集合本身就变，得重画；
  // 只改一个假设值时形状不动，重画只是白闪一下，交给 redrawValues 就地刷新。
  const key = band.map((node) => `${node.key}<${(node.upstream || []).join(",")}`).join("|");
  const rebuilt = key !== bandKey;
  bandKey = key;
  return rebuilt;
}

// ---------------------------------------------------------------- 取值
function valueOf(key) {
  const row = state.att[key];
  if (row && "current" in row) return row.current;
  const node = state.nodes[key];
  return node ? node.baseline : null;
}

function shortValue(node) {
  const value = valueOf(node.key);
  if (value === null || value === undefined || value === "") return "—";
  if (typeof value === "object") {
    const years = Object.keys(value).sort();
    if (!years.length) return "—";
    return `${years[0]}:${fmt(value[years[0]], node.unit)} → ${years.at(-1)}:${fmt(value[years.at(-1)], node.unit)}`;
  }
  return fmt(value, node.unit);
}

// ---------------------------------------------------------------- 布局：列＝拓扑深度，过高的列拆成并排的带
function place(zoom) {
  const W = BASE.nodeW * zoom, H = BASE.nodeH * zoom, GY = BASE.gapY * zoom, PAD = BASE.pad * zoom, HEAD = BASE.head * zoom;
  // 字数上限只跟字号有关，与缩放无关（框和字同比放大），所以放在这里算一次给绘制与刷新共用。
  geo = { nodeW: W, nodeH: H, stepX: W + BASE.gapX * zoom, pad: PAD, zoom, labelMax: 17, valueMax: 20, formulaMax: 21 };
  const byLayer = [];
  for (const key of state.order) (byLayer[state.nodes[key].layer] ||= []).push(state.nodes[key]);
  // 28 个节点堆在一列要滚三屏：拆成并排的几条带，纵向换横向，反正横向往本就是拖拽看的。
  const lanes = byLayer.map((list) => {
    if (!list) return [];
    const out = [];
    for (let i = 0; i < list.length; i += MAX_STACK) out.push(list.slice(i, i + MAX_STACK));
    return out;
  });
  const slotOf = [];
  let slot = 0;
  lanes.forEach((list) => { slotOf.push(slot); slot += Math.max(1, list.length); });
  state.slots = slot;
  const tallest = Math.max(0, ...lanes.map((list) => Math.max(0, ...list.map((lane) => lane.length))));
  const headers = [];
  let bandTitled = false;
  lanes.forEach((list, layer) => {
    list.forEach((lane, laneIndex) => {
      let y = PAD + HEAD + ((tallest - lane.length) * (H + GY)) / 2;   // 每条带各自竖向居中
      for (const node of lane) { node.x = PAD + (slotOf[layer] + laneIndex) * geo.stepX; node.y = y; y += H + GY; }
      // 估值段摊成十来个栏，每栏重复一次「估值：引擎步骤」等于没写：只在第一栏报组名，其后各栏用本栏打头的那一步命名，
      // 读起来就是「走到哪儿了」。假设链的栏数固定，仍用层名。
      let title;
      if (!lane[0].band) title = LAYER_TITLES[layer] || `${layer} 层上游`;
      else if (!bandTitled) { title = lane[0].group_title; bandTitled = true; }
      else title = clip(lane[0].label, 12);
      const tag = list.length > 1 ? ` · 第 ${laneIndex + 1}/${list.length} 带` : "";
      const count = lane.length > 1 ? ` · ${lane.length} 行` : "";
      headers.push({ x: PAD + (slotOf[layer] + laneIndex) * geo.stepX, text: `${title}${tag}${count}` });
    });
  });
  return {
    width: PAD * 2 + slot * geo.stepX - BASE.gapX * zoom,
    height: PAD * 2 + HEAD + tallest * H + Math.max(0, tallest - 1) * GY,
    headers,
  };
}

// 「适配窗口」只量竖向：把每一带的行数装进容器就停手，横向一律交给拖拽。
// 全图适配在这里是错的方向——图摊到十几列本来就是为了不挤，硬缩到一屏会让字变成 5 个点。
function layout() {
  const wanted = $("zoom").value;
  if (wanted !== "fit") return place(Number(wanted));
  const box = $("graph-scroll");
  const first = place(1);
  const fit = Math.min(1.3, Math.max(0.5, (box.clientHeight - 16) / first.height));
  return place(fit);
}

function edgePath(node, parent) {
  const x1 = parent.x + geo.nodeW, y1 = parent.y + geo.nodeH / 2;
  const x2 = node.x, y2 = node.y + geo.nodeH / 2;
  const bend = Math.max(24 * geo.zoom, (x2 - x1) / 2);
  return `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`;
}

// ---------------------------------------------------------------- 绘制
function nodeMarkup(node) {
  const z = geo.zoom;
  const cls = ["node", node.changed ? "edited" : "", node.derived ? "derived" : "",
    node.kind === "engine" ? "engine" : "", !node.editable && !node.derived ? "ref" : ""].filter(Boolean).join(" ");
  const tip = [node.label + "（" + (node.group_title || "") + "）", node.formula, node.source, node.note, node.evidence].filter(Boolean).join("\n");
  return `<g class="${cls}" data-key="${node.key}" transform="translate(${node.x},${node.y})">`
    + `<title>${esc(tip)}</title>`
    + `<rect class="box" width="${geo.nodeW}" height="${geo.nodeH}"></rect>`
    + `<rect width="3" height="${geo.nodeH}" fill="${GROUP_COLOR[node.group] || "#94a3b8"}"></rect>`
    + `<text x="8" y="${13 * z}">${esc(clip(node.label, geo.labelMax))}</text>`
    + `<text class="v" x="8" y="${27 * z}">${esc(clip(shortValue(node), geo.valueMax))}</text>`
    + `<text class="f" x="8" y="${39 * z}">${formulaSpans(node)}</text></g>`;
}

function formulaSpans(node) {
  return wrap(node.formula, geo.formulaMax).map((line, i) => `<tspan x="8" dy="${i ? 11 * geo.zoom : 0}">${esc(line)}</tspan>`).join("");
}

function draw() {
  const size = layout();
  const parts = ['<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">',
    '<path d="M0,0 L8,4 L0,8 z" fill="#c3c8d1"/></marker></defs>', '<g class="edges">'];
  for (const edge of state.edges) {
    const node = state.nodes[edge.to], parent = state.nodes[edge.from];
    // 虚线＝这条边只在建链那一刻算过：改它的上游，这一格不会回头重算（判据在节点的 live 上）。
    parts.push(`<path class="edge${node.live === false ? " build-only" : ""}" data-from="${edge.from}" data-to="${edge.to}" d="${edgePath(node, parent)}"></path>`);
  }
  parts.push('</g><g class="nodes">');
  for (const key of state.order) parts.push(nodeMarkup(state.nodes[key]));
  parts.push("</g>");
  for (const header of size.headers) {
    parts.push(`<text class="col-title" x="${header.x}" y="${geo.pad + BASE.head * geo.zoom * 0.55}">${esc(header.text)}</text>`);
    parts.push(`<line class="col-rule" x1="${header.x - 7 * geo.zoom}" y1="${geo.pad + BASE.head * geo.zoom * 0.75}" x2="${header.x - 7 * geo.zoom}" y2="${size.height - geo.pad}"></line>`);
  }
  const svg = $("graph");
  svg.setAttribute("width", size.width);
  svg.setAttribute("height", size.height);
  svg.setAttribute("viewBox", `0 0 ${size.width} ${size.height}`);
  svg.innerHTML = parts.join("");
  svg.querySelectorAll(".node").forEach((el) => el.addEventListener("click", () => select(el.dataset.key)));
  redrawValues();
}

function redrawValues() {
  const svg = $("graph");
  for (const key of state.order) {
    const el = svg.querySelector(`.node[data-key="${key}"]`);
    if (!el) continue;
    const node = state.nodes[key];
    node.changed = Boolean(state.att[key]?.changed);
    el.classList.toggle("edited", node.changed);
    el.querySelector(".v").textContent = clip(shortValue(node), geo.valueMax);
    // 估值段的公式里代的是引擎真正用过的那批标量（税率、r、g…），重算后必须跟着换，否则式和数各说一套。
    el.querySelector(".f").innerHTML = formulaSpans(node);
  }
  paintSelection();
}

// 选中一行＝问「这个数从哪来、又流到哪去」，所以两端取闭包而不是邻边：改动本来就要穿过几步才落到每股价值。
function closure(key) {
  const reach = (dir) => {
    const seen = new Set();
    let frontier = [key];
    while (frontier.length) {
      const next = [];
      for (const edge of state.edges) {
        const from = edge[dir === "up" ? "to" : "from"], to = edge[dir === "up" ? "from" : "to"];
        if (frontier.includes(from) && !seen.has(to)) { seen.add(to); next.push(to); }
      }
      frontier = next;
    }
    return seen;
  };
  const up = reach("up"), down = reach("down");
  return { up, down, all: new Set([key, ...up, ...down]) };
}

function paintSelection() {
  const svg = $("graph");
  if (!state.selected && !state.chain) {
    svg.querySelectorAll(".node,.edge").forEach((el) => el.classList.remove("fade", "hot", "selected"));
    return;
  }
  // 放大态亮的是「链尾 + 上游两层」那一小组；普通选中态仍按两端闭包亮。两种都是变暗，不是隐藏——
  // 整图本来就是给人看全貌的，亮一条链不该把它换掉。
  const all = state.chain ? new Set(chainOf(state.chain)) : closure(state.selected).all;
  svg.querySelectorAll(".node").forEach((el) => el.classList.toggle("fade", !all.has(el.dataset.key)));
  svg.querySelectorAll(".edge").forEach((el) => {
    const on = all.has(el.dataset.from) && all.has(el.dataset.to);
    el.classList.toggle("hot", on);
    el.classList.toggle("fade", !on);
  });
  svg.querySelector(`.node[data-key="${state.selected}"]`)?.classList.add("selected");
}

function select(key) {
  state.selected = state.selected === key ? "" : key;
  paintSelection();
  renderDetail(true);
}

// ---------------------------------------------------------------- 侧栏
const link = (key) => `<span class="link" data-goto="${key}">${esc(clip(state.nodes[key]?.label || key, 14))}</span>`;

function changeText(row) {
  const change = row?.change_pct;
  if (change === null || change === undefined) return '<span class="dim">—</span>';
  if (typeof change === "object") {
    const moved = Object.entries(change).filter(([, v]) => v);
    return moved.length ? moved.map(([y, v]) => `${y}${v > 0 ? "↑" : "↓"}`).join(" ") : '<span class="dim">0</span>';
  }
  return signed(change);
}

function detailRows(node) {
  const row = state.att[node.key] || {};
  return [
    ["组", esc(node.group_title)],
    ["性质", KIND[node.kind] ? `${KIND[node.kind]}${node.confidence ? ` · ${esc(node.confidence)}` : ""}` : "—"],
    ["机器基线", esc(fmt(node.baseline, node.unit))],
    ["当前值", esc(fmt(valueOf(node.key), node.unit))],
    ["改动%", changeText(row)],
    ["归因%", signed(row.contribution_pct)],
  ].map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join("");
}

function formulaBlock(node) {
  return node.formula ? `<div class="formula" id="d-formula"><b>怎么算</b>　${esc(node.formula)}</div>` : "";
}

// 估值段的「显性期合计」旁边给一张逐年表：图上只摊一个聚合节点（用户选的口径），
// 真要按年看细节就在侧栏看，不必把 7 年 × 每个步骤全摊到图上。
function seriesInner(node) {
  const years = Object.keys(node.series).sort();
  const rows = years.map((year) => `<tr><td>${esc(year)}</td><td>${esc(fmt(node.series[year], node.unit))}</td></tr>`).join("");
  return `<p class="why"><b>逐年</b>　显性期 ${years.length} 年，合计即上方那个数</p>`
    + `<table class="series"><thead><tr><th>年份</th><th>${esc(node.unit || "值")}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function seriesBlock(node) {
  return node.series ? `<div id="d-series">${seriesInner(node)}</div>` : "";
}

// force＝重画改动框。改数后的重算绝不能带 force：那会把用户正在敲的框重置成基线。
function renderDetail(force = false) {
  const detail = $("detail");
  const node = state.nodes[state.selected];
  if (!node) {
    state.renderedFor = "";
    detail.innerHTML = "<h3>未选中节点</h3><p class='why muted'>点图上任意一行看它的来源、凭证、公式与改动框。栏＝离原始取数几步（最左栏是无上游的原始值），箭头从上游指向本行；一行放不下时会拆成并排的几条带。</p>"
      + "<p class='why muted'>图太宽就用鼠标按住拖动看别的栏。蓝虚框＝级联结果，改上游就当场重算。红虚框＝引擎算出的估值步骤（营收→EBIT→NOPAT→现金流→现值→终值→股权→每股），不可直接改。灰底＝参考行，不进定价。黄底＝本次改过。</p>";
    return;
  }
  if (!force && state.renderedFor === node.key && detail.querySelector("#editor")) {
    $("d-rows").innerHTML = detailRows(node);
    // 估值段的公式里代的是引擎刚用过的那批标量，重算后式子和逐年表都要跟着换，否则侧栏会留着上一次的数。
    const formula = $("d-formula");
    if (formula && node.formula) formula.innerHTML = `<b>怎么算</b>　${esc(node.formula)}`;
    const series = $("d-series");
    if (series && node.series) series.innerHTML = seriesInner(node);
    return;
  }
  state.renderedFor = node.key;
  detail.innerHTML = `<h3>${esc(node.label)}</h3><div class="muted">${esc(node.key)}</div>`
    + `<div id="d-rows">${detailRows(node)}</div>`
    + formulaBlock(node)
    + seriesBlock(node)
    + (node.source ? `<p class="why"><b>来源</b>　${esc(node.source)}</p>` : "")
    + (node.note ? `<p class="why"><b>说明</b>　${esc(node.note)}</p>` : "")
    // 凭证（窗口、样本、护栏判定、取数时刻）收在折叠里：要复核才展开，平时一屏只看这行的意义。
    // 老批次还没分家，evidence 为空，长说明照旧走上面那行。
    + (node.evidence ? `<details class="why"><summary><b>凭证</b>　<span class="muted">窗口／样本／取数</span></summary><p class="muted">${esc(node.evidence)}</p></details>` : "")
    + `<p class="why"><b>上游</b>　${node.upstream.length ? node.upstream.map(link).join("、") : '<span class="muted">无（原始取数或惯例值）</span>'}</p>`
    + `<p class="why"><b>喂给</b>　${node.downstream.length ? node.downstream.map(link).join("、")
      : node.editable ? '<span class="muted">无：它是叶子，不喂任何行，只被引擎读本行得出每股价值</span>'
        : '<span class="muted">无：它既不喂行，也不进定价</span>'}</p>`
    // 放大入口放在侧栏末尾：它摊开的是「这一行的来路」，先看值、公式、上下游，再决定要不要看推导。
    + `<p class="why"><button id="magnify">⤢ 放大这条链</button>　<span class="muted">弹出一张浮层：上面只画这一行与它上游两层的链图，下面逐行给推导（只读）。Esc 或「返回整图」回去</span></p>`
    + `<div class="editor" id="editor"></div>`;
  buildEditor(node);
  detail.querySelectorAll("[data-goto]").forEach((el) => el.addEventListener("click", () => select(el.dataset.goto)));
  $("magnify").addEventListener("click", () => openChain(node.key));
}

// 控件语义与面板一致：金额行填「相比基线 ±%」，比率行填数值，基线非正的金额行退回绝对值。
// 换算只发生在这台浏览器里，进 overrides／manual.json 的永远是绝对值。
function buildEditor(node) {
  const holder = $("editor");
  holder.innerHTML = "";
  const row = state.att[node.key] || node;
  const push = (...els) => els.forEach((el) => holder.append(el));
  // 用 insertAdjacentHTML 而不是 append(字符串)：后者会把标签当纯文本节点塞进去，图上就多出一行 <p …>。
  const note = (text) => holder.insertAdjacentHTML("beforeend", `<p class="why muted">${text}</p>`);
  if (node.kind === "engine") return note("估值步骤由引擎算出，不在这里填数——它是上游那些假设的必然结果。改上游（"
    + node.upstream.map((k) => clip(state.nodes[k]?.label || k, 10)).join("、") + "）时这一行连公式里的税率、折现率一起重算。");
  if (node.derived) return note(`级联结果，不可直接编辑——改上游（${node.upstream.map((k) => clip(state.nodes[k]?.label || k, 10)).join("、")}）会当场重算这一行。`);
  if (!node.editable) return note("这一行不进定价（参考值／文本行），改了不会动估值。");
  if (node.value_type === "text") return note("文本行，只作说明显示。");
  if (node.value_type === "bool") {
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = Boolean(valueOf(node.key));
    input.addEventListener("change", () => write(node.key, input.checked === node.baseline ? undefined : input.checked));
    return push(muted(`开启（基线 ${node.baseline ? "是" : "否"}）　`), input);
  }

  const current = valueOf(node.key);
  if (node.value_type === "year_map") {
    const wrap = document.createElement("div");
    wrap.className = "years";
    for (const year of Object.keys(node.baseline).sort()) {
      const base = node.baseline[year];
      const mode = modeOf(row, base);
      const shown = current?.[year] ?? base;
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.className = boxClass(row, mode);
      input.value = toBox(row, base, shown, mode);
      if (mode === "delta") { input.placeholder = "±%"; input.title = `${year} 基线 ${fmt(base, node.unit)}，填相比基线的百分比`; }
      const abs = document.createElement("span");
      abs.className = "abs";
      abs.textContent = fmt(shown, node.unit);
      input.addEventListener("input", () => {
        const raw = input.value.trim();
        const value = raw === "" ? null : toAbsolute(row, base, raw, mode);
        if (value === null) { $("status").textContent = "输入不是数字，未重算"; return; }
        const changed = raw !== "" && isChanged(raw, value, base, mode);
        writeYear(node.key, year, changed ? value : null);
        abs.textContent = fmt(changed ? value : base, node.unit);
      });
      wrap.append(muted(year), input, abs);
    }
    return push(wrap, revertButton(node));
  }

  const base = node.baseline;
  const mode = modeOf(row);
  const input = document.createElement("input");
  input.type = "number";
  input.step = "any";
  input.className = boxClass(row, mode);
  input.value = toBox(row, base, current ?? base, mode);
  if (mode === "delta") { input.placeholder = "±%"; input.title = `相比机器基线 ${fmt(base, node.unit)} 的百分比改动`; }
  const readout = document.createElement("span");
  readout.className = "abs";
  readout.textContent = mode === "delta" ? `→ ${fmt(current, node.unit)}` : "";
  input.addEventListener("input", () => {
    const raw = input.value.trim();
    const value = raw === "" ? null : toAbsolute(row, base, raw, mode);
    if (value === null) { $("status").textContent = "输入不是数字，未重算"; return; }
    const changed = raw !== "" && isChanged(raw, value, base, mode);
    write(node.key, changed ? value : undefined);
    readout.textContent = mode === "delta" ? `→ ${fmt(changed ? value : base, node.unit)}` : "";
  });
  push(muted(mode === "delta" ? "相比基线 %　" : `改为（基线 ${fmt(base, node.unit)}）　`), input, readout, revertButton(node));
}

const muted = (text) => Object.assign(document.createElement("span"), { className: "muted", textContent: text });

// ---------------------------------------------------------------- 放大一条链
// 链＝链尾 + 上游两层（按跳数，不是按列号：market_cap 距 wacc 两跳却落在第 0 列，按列号切会把它切掉）。
// 整条上游闭包在 每股价值 那一行能铺到 48 行——那不是放大，是另画一张图；两层刚好回答「这一步从哪来」。
// 放大态是页内模态浮层：浮层里重画一条只含这些节点的小链图，下面摊推导过程，且**只读**——
// 改数回到整图或面板，两条写入通路（/api/recompute、/api/save）不因多一个视图而分叉。
const CHAIN_DEPTH = 2;

function hopMap(key, depth = CHAIN_DEPTH) {
  const hops = new Map([[key, 0]]);
  let frontier = [key];
  for (let hop = 0; hop < depth; hop++) {
    const next = [];
    for (const node of frontier) {
      for (const up of state.nodes[node]?.upstream || []) {
        if (!hops.has(up)) { hops.set(up, hop + 1); next.push(up); }
      }
    }
    frontier = next;
    if (!frontier.length) break;
  }
  return hops;
}

function chainOf(key, depth = CHAIN_DEPTH) {
  const hops = hopMap(key, depth);
  // 行序跟着整图（层号, 建链顺序），所以最左的原始取数／惯例值自然排在第一跳。
  return state.order.filter((node) => hops.has(node));
}

// 浮层里那张小图：栏＝距链尾几跳（链尾在最右，越左越原始），行内按整图的行序摆。
// 「干净」是靠只画这些节点做到的，而不是把整图调暗——放大页里压根不存在别的链。
const CBOX = { minW: 214, maxW: 368, h: 56, gapX: 56, gapY: 14, pad: 14, head: 26, gutter: 36 };

// 两跳封顶＝最多三栏，所以栏宽跟着浮层的实际宽度摊满：定宽 214 会在右边留半张白图，
// 读的人分不清是没画还是画完了，而公式也被截成「WACC = w_e × CoE + (1 − w_…」。
// gutter 是浮层板子自己的左右内边距——不减掉它图会宽出一截，白惹一条横向滚动条。
function chainBoxWidth(cols) {
  const avail = $("chain").clientWidth - CBOX.gutter - CBOX.pad * 2 - Math.max(0, cols - 1) * CBOX.gapX;
  return Math.max(CBOX.minW, Math.min(CBOX.maxW, Math.floor(avail / Math.max(1, cols))));
}

function chainEdge(a, b, boxW, buildOnly) {
  const y1 = a.y + CBOX.h / 2, y2 = b.y + CBOX.h / 2;
  const cls = buildOnly ? "cedge build-only" : "cedge";
  if (b.x > a.x + 4) {
    const x1 = a.x + boxW, x2 = b.x, bend = Math.max(26, (x2 - x1) / 2);
    return `<path class="${cls}" d="M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}"></path>`;
  }
  // 同栏相邻（上游与下游都距链尾一样跳）时不硬穿过去，改从下沿绕到上沿。
  const x1 = a.x + boxW - 18, x2 = b.x + boxW - 18;
  return `<path class="${cls}" d="M${x1},${a.y + CBOX.h} C${x1 + 30},${a.y + CBOX.h + 16} ${x2 + 30},${b.y - 16} ${x2},${b.y}"></path>`;
}

function chainGraph(keys) {
  const hops = hopMap(state.chain);
  const maxHop = Math.max(0, ...keys.map((key) => hops.get(key) || 0));
  const cols = [];
  for (const key of keys) (cols[maxHop - (hops.get(key) || 0)] ||= []).push(key);
  const tallest = Math.max(1, ...cols.map((list) => (list || []).length));
  const boxW = chainBoxWidth(cols.length);
  const width = CBOX.pad * 2 + cols.length * boxW + Math.max(0, cols.length - 1) * CBOX.gapX;
  const height = CBOX.pad * 2 + CBOX.head + tallest * (CBOX.h + CBOX.gapY);
  const pos = new Map();
  cols.forEach((list, c) => {
    let y = CBOX.pad + CBOX.head + ((tallest - list.length) * (CBOX.h + CBOX.gapY)) / 2;
    for (const key of list) { pos.set(key, { x: CBOX.pad + c * (boxW + CBOX.gapX), y }); y += CBOX.h + CBOX.gapY; }
  });
  const parts = ['<defs><marker id="carrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">',
    '<path d="M0,0 L8,4 L0,8 z" fill="#c3c8d1"/></marker></defs>'];
  for (let c = 0; c < cols.length; c++) {
    parts.push(`<text class="ccol" x="${CBOX.pad + c * (boxW + CBOX.gapX)}" y="${CBOX.pad + 15}">`
      + `${esc(c === cols.length - 1 ? "链尾（本行）" : `上游 ${cols.length - 1 - c} 跳`)}</text>`);
  }
  for (const [to, p] of pos) {
    for (const from of state.nodes[to].upstream) if (pos.has(from)) parts.push(chainEdge(pos.get(from), p, boxW, state.nodes[to].live === false));
  }
  // 每格四行：名称／值／公式一行。能塞几个字由栏宽算出来，不是拍脑袋写死的字符数。
  const labelMax = Math.floor((boxW - 20) / 12);
  const formulaMax = Math.floor((boxW - 20) / 6.6);
  for (const key of keys) {
    const node = state.nodes[key], p = pos.get(key);
    parts.push(`<g class="cnode${key === state.chain ? " tail" : ""}" data-chain="${key}" transform="translate(${p.x},${p.y})">`
      + `<title>${esc(node.label)} · ${esc(node.key)}：点这里把链尾挪到这一行，往上游再走两跳</title>`
      + `<rect width="${boxW}" height="${CBOX.h}" rx="6"></rect>`
      + `<rect width="3" height="${CBOX.h}" fill="${GROUP_COLOR[node.group] || "#94a3b8"}"></rect>`
      + `<text x="9" y="15">${esc(clip(node.label, labelMax))}</text>`
      + `<text class="v" x="9" y="29">${esc(clip(shortValue(node), labelMax))}</text>`
      + `<text class="f" x="9" y="44">${esc(clip(node.formula || "", formulaMax))}</text></g>`);
  }
  return `<div class="chain-graph"><svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" `
    + `viewBox="0 0 ${width} ${height}">${parts.join("")}</svg></div>`;
}

// 只有标量才代得进去：逐年序列、文本行、这一行不在图上，一律交回空串，让代入式整条不出。
function scalarOf(key) {
  const node = state.nodes[key];
  const value = node ? valueOf(key) : null;
  return typeof value === "number" && Number.isFinite(value) ? fmt(value, node.unit) : "";
}

function cellChips(keys) {
  return keys.map((key) => {
    const node = state.nodes[key];
    if (!node) return "";
    const value = valueOf(key);
    const text = scalarOf(key) || (value && typeof value === "object" ? "逐年序列" : "—");
    return `<span title="${esc(node.label)}">${esc(clip(node.label, 12))} ${esc(text)}</span>`;
  }).join("");
}

// 逐年序列在整图上只摊一格（七年 × 每一步全摊开，图就不是给人看的了）；放大页给它一张完整表。
// 估值段的 node.series 是引擎逐年算出的那一段，假设行的 value 本身就是逐年映射，两者一张表装下。
function yearBlock(node) {
  const value = valueOf(node.key);
  const map = node.series || (value && typeof value === "object" && !Array.isArray(value) ? value : null);
  const years = map ? Object.keys(map).sort() : [];
  if (!years.length) return "";
  const change = state.att[node.key]?.change_pct;
  const perYear = change && typeof change === "object";
  const head = perYear ? "<th>改动%</th>" : "";
  const rows = years.map((year) => `<tr><td>${esc(year)}</td><td>${esc(fmt(map[year], node.unit))}</td>`
    + (perYear ? `<td>${signed(Number(change[year] || 0))}</td>` : "") + "</tr>").join("");
  return `<p class="why"><b>逐年</b>　${years.length} 年（${esc(years[0])} → ${esc(years.at(-1))}），单位 ${esc(node.unit || "值")}</p>`
    + `<table class="series"><thead><tr><th>年份</th><th>${esc(node.unit || "值")}</th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

const layerNote = (node) => (node.band ? "估值步骤" : node.layer === 0 ? "原始取数／惯例值" : `离原始取数 ${node.layer} 步`);

function stepBlock(node, index, total) {
  const row = state.att[node.key] || {};
  const sub = substituteText(node.substitute, scalarOf);
  const upstream = node.upstream.filter((key) => state.nodes[key]);
  return `<div class="step${node.key === state.chain ? " tail" : ""}">`
    + `<h4><span class="idx">#${index + 1}/${total}</span>${esc(node.label)}`
    + `<span class="k">${esc(node.key)} · ${esc(node.group_title)} · ${KIND[node.kind] || "—"} · ${esc(layerNote(node))}</span>`
    + (upstream.length ? `<button class="mag" data-chain="${node.key}" title="只摊这一跳的上游">放大到此</button>` : "")
    + `</h4>`
    + `<p class="why"><b>当前值</b>　${esc(fmt(valueOf(node.key), node.unit))}`
    + `　基线 ${esc(fmt(node.baseline, node.unit))}　改动 ${changeText(row)}　归因 ${signed(row.contribution_pct)}</p>`
    + (node.formula ? `<div class="expr"><b>怎么算</b>　${esc(node.formula)}</div>` : "")
    // 代入式里的每个数字都是从上面那排「引用格」抄的（同一个 fmt、同一份当前值），不是这里重算出来的。
    + (sub ? `<div class="expr sub"><b>代入</b>　${esc(sub)}</div>` : "")
    + (upstream.length ? `<p class="why muted">引用的行</p><div class="cells">${cellChips(upstream)}</div>` : "")
    + yearBlock(node)
    + (node.source ? `<p class="why"><b>来源</b>　${esc(node.source)}</p>` : "")
    + (node.note ? `<p class="why"><b>说明</b>　${esc(node.note)}</p>` : "")
    + (node.evidence ? `<details class="why"><summary><b>凭证</b>　<span class="muted">窗口／样本／取数</span></summary><p class="muted">${esc(node.evidence)}</p></details>` : "")
    + `</div>`;
}

function renderChain() {
  const node = state.nodes[state.chain];
  if (!node) { closeChain(); return; }   // 换批次后这一行不在了：收起浮层，整图照旧
  const keys = chainOf(state.chain);
  const row = state.att[state.chain] || {};
  $("chain").innerHTML = `<div class="chain-bar">`
    + `<button id="chain-back">← 返回整图</button>`
    + (state.trail.length > 1 ? `<button id="chain-up">↑ 上一层链</button>` : "")
    + `<span class="muted">这里只有这一条链：链尾与它的上游两层，共 ${keys.length} 行。整图在背后原地不动，Esc 或「返回整图」回去。`
    + `只读——改数请在整图上或面板里改</span></div>`
    + chainGraph(keys)
    + `<div class="chain-tail"><span>${esc(node.label)}</span><b>${esc(fmt(valueOf(state.chain), node.unit))}</b>`
    + `<span class="muted">机器基线 ${esc(fmt(node.baseline, node.unit))}　改动 ${changeText(row)}　对每股价值的归因 ${signed(row.contribution_pct)}</span></div>`
    + `<p class="chain-note">读法：小图从左到右＝来路走向链尾，栏头写明距链尾几跳；点任一格子把链尾挪到那一行（往上游再走两跳）。`
    + "下面逐行给符号式，再把链上那些行的当前值代进符号给出代入式——代进去的数与图上那一格同源（同一个 fmt、同一份重算结果），"
    + "这里不算新的数。分子是序列端点或不在这行上游的量就没有代入式（硬凑就是假精确），看符号式与「引用的行」即可。"
    + "注意式子用的是显示值（比率两位小数），拿它手算会与本行差在小数点后第二位，要精确值看面板与 CLI。</p>"
    + keys.map((key, index) => stepBlock(state.nodes[key], index, keys.length)).join("");
  $("chain").querySelectorAll("[data-chain]").forEach((el) => el.addEventListener("click", () => openChain(el.dataset.chain)));
  $("chain-back").addEventListener("click", closeChain);
  $("chain-up")?.addEventListener("click", backToParentChain);
}

// 浮层显隐＝放大态的全部副作用：背后那张整图与侧栏一个节点都不动，只是被压住。
// 背景锁滚动，否则滚轮会同时推走背后那张一屏多高的图。
function showChainView(on) {
  $("chain-overlay").classList.toggle("hide", !on);
  document.body.style.overflow = on ? "hidden" : "";
}

function syncUrl() {
  const url = new URL(location.href);
  url.searchParams.set("code", state.code);
  if (state.run) url.searchParams.set("run", state.run);
  if (state.chain) url.searchParams.set("chain", state.chain);
  else url.searchParams.delete("chain");
  // replaceState 而不是 pushState：放大／返回不该占用浏览器的后退栈——后退本该回到上一页，
  // 页面内的层级由上面那两个按钮负责，语义只有一套。
  history.replaceState({ chain: state.chain }, "", url);
}

function openChain(key) {
  if (!state.nodes[key]) return;
  if (state.chain === key) return;
  state.trail.push(key);
  state.chain = key;
  state.selected = key;      // 背后整图高亮的那一组跟着链尾走，侧栏也停在这一行
  showChainView(true);
  renderChain();
  paintSelection();
  renderDetail(true);        // 深链进来时侧栏还写着「未选中节点」：链尾就是选中行，得跟着换
  $("chain-overlay").scrollTop = 0;   // 从上一层链跳进来时别停在半路
  syncUrl();
}

function backToParentChain() {
  state.trail.pop();
  const parent = state.trail.at(-1);
  state.chain = parent || "";
  if (!parent) { closeChain(); return; }
  state.selected = parent;
  renderChain();
  paintSelection();
  renderDetail(true);
  $("chain-overlay").scrollTop = 0;
  syncUrl();
}

// 收起＝浮层撤掉，回到那张一直没动过的整图：侧栏仍停在链尾那一行。
function closeChain() {
  state.chain = "";
  state.trail = [];
  showChainView(false);
  paintSelection();
  renderDetail(false);   // 侧栏仍停在链尾那一行；深链进来时它可能还没渲染过
  syncUrl();
}

// ---------------------------------------------------------------- 拖拽平移
// 图摊宽了才谈得上「不用那么拥挤」，而摊宽就必看不全——所以按住拖动，而不是一条横向滚动条：
// 滚动条在触屏与触控板上本来就等价，但按住哪都能拖这件事让「这块还能往右看」不需要提示才发现。
// 阈值是必须的：pointerdown 落在节点上，松手前只要挪了 1 像素，click 就会把选中改掉。
function enablePan(box) {
  let start = null, dragged = false;
  box.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || event.target.closest("input,button,a,select")) return;
    start = { x: event.clientX, y: event.clientY, left: box.scrollLeft, top: box.scrollTop };
    dragged = false;
  });
  box.addEventListener("pointermove", (event) => {
    if (!start) return;
    const dx = event.clientX - start.x, dy = event.clientY - start.y;
    if (!dragged && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    if (!dragged) {
      dragged = true;
      box.classList.add("grabbing");
      box.setPointerCapture(event.pointerId);
    }
    box.scrollLeft = start.left - dx;
    box.scrollTop = start.top - dy;
  });
  const stop = () => { start = null; box.classList.remove("grabbing"); };
  box.addEventListener("pointerup", stop);
  box.addEventListener("pointercancel", stop);
  // 捕获阶段拦在节点之前：拖完这一下不算点击。
  box.addEventListener("click", (event) => {
    if (!dragged) return;
    event.stopPropagation();
    event.preventDefault();
    dragged = false;
  }, true);
}

function revertButton(node) {
  const button = document.createElement("button");
  button.textContent = "退回机器基线";
  button.addEventListener("click", () => {
    delete state.overrides[node.key];
    applyOverrides();
  });
  return button;
}

function write(key, value) {
  if (value === undefined) delete state.overrides[key];
  else state.overrides[key] = value;
  schedule();
}

function writeYear(key, year, value) {
  const edits = state.overrides[key] ? { ...state.overrides[key] } : {};
  if (value === null) delete edits[year];
  else edits[year] = value;
  if (Object.keys(edits).length) state.overrides[key] = edits;
  else delete state.overrides[key];
  schedule();
}

// ---------------------------------------------------------------- 与后端对话
let timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(() => recompute(), 220); }

async function recompute() {
  const seq = ++state.seq;
  $("status").textContent = "重算中…";
  try {
    const response = await fetch("/api/recompute", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        code: state.code, run: state.run, overrides: state.overrides,
        method: $("method").value, terminal: $("terminal").value,
        rate: $("rate").value.trim(), light: true,
      }),
    });
    const data = await response.json();
    if (seq !== state.seq) return;
    if (!response.ok) { $("status").textContent = "✗ " + data.error; return; }
    state.att = Object.fromEntries(data.attribution.rows.map((row) => [row.key, row]));
    state.data = data;
    // 「ERP 窗口」下拉与面板同一套判据：选项来自那四行实测里能用的窗口，选中谁由 overrides.erp 反推。
    renderErpWindow($("erpwindow"), data.erp_windows, state.overrides.erp);
    // 估值段的值只读这一次 run 的结果，图上不为画图再跑一遍引擎——那样两处数字迟早分叉。
    if (compose(data.attribution.valuation)) draw(); else redrawValues();
    if (state.chain) renderChain();   // 放大段跟着重算的当前值走，否则式子与数各说一套
    renderSummary(data);
    renderNotices(data);
    renderDetail(false);
    $("status").textContent = `✓ ${data.timings.total_ms} ms`;
  } catch (exc) {
    if (seq === state.seq) $("status").textContent = "✗ 请求失败: " + exc;
  }
}

// 载入/清空改动：整块重画改动框（值变了），但图的骨架不动。
function applyOverrides() {
  state.renderedFor = "";
  recompute();
}

function renderSummary(data) {
  const att = data.attribution;
  const band = (att.valuation && att.valuation.nodes) || [];
  $("summary").innerHTML = [
    card("每股价值", fmt(att.per_share), `基线 ${fmt(att.baseline_per_share)}　${signed(att.total_change_pct)}`),
    card("改动节点", String(att.edited_row_count), att.unpriced_edits.length ? `未定价改动：${esc(att.unpriced_edits.join("、"))}` : "归因是单行敏感性，多行不可相加"),
    card("折现率", fmt(att.rate, "pct"), `本视图用·级联 ${att.method === "fcfe" ? "股权成本" : "WACC"}`),
    card("假设链", `${state.order.length - band.length} 行 · ${state.edges.length} 条边`, `${state.columns} 层深（含估值段）摊成 ${state.slots} 栏；最左 ${state.roots.length} 行是原始取数／惯例值`),
    card("估值段", `${band.length} 步`, band.length ? `营收 → … → ${esc(band.at(-1).label)}，逐年看侧栏`
      : esc((data.attribution.warnings || [])[0] || "引擎没能出估值")),
  ].join("");
}
const card = (title, value, note) => `<div class="card"><span>${title}</span><b>${value}</b><span class="muted">${note}</span></div>`;

function renderNotices(data) {
  const saved = data.saved?.overrides && Object.keys(data.saved.overrides).length;
  const edited = data.attribution.edited_row_count;
  const notes = [];
  // 建链那一刻的顶层降级（如 ERP 退回惯例值）与本页的引擎警示同一条带：图上每个节点都受它影响。
  for (const w of data.warnings || []) notes.push(`<div class="strip warn">${esc(w)}</div>`);
  if (saved && !edited) {
    notes.push(`<div class="strip strip-ok">已保存的修正（${esc(Object.keys(data.saved.overrides).join("、"))}，${esc(data.saved.saved_at)}）：`
      + '<button id="restore">载入到图上</button>　不载入则本页显示机器基线。</div>');
  }
  if (!notes.length) notes.push('<div class="strip muted">改任一节点自动重算；「保存修正」写入这一批次的 manual.json，与面板、CLI 复现的是同一份文件。</div>');
  $("notices").innerHTML = notes.join("");
  $("restore")?.addEventListener("click", () => {
    state.overrides = JSON.parse(JSON.stringify(data.saved.overrides));
    applyOverrides();
  });
}

async function loadGraph() {
  if (!state.code || !state.run) {
    $("status").textContent = "runs/ 下还没有基线：先到搜索页取数估值";
    state.renderedFor = "";
    state.chain = "";
    state.trail = [];
    showChainView(false);
    renderErpWindow($("erpwindow"), [], null);   // 没批次就没窗口可选：下拉清空并置灰，别留着上一批的选项
    renderDetail(true);
    return;
  }
  const response = await fetch("/api/derivation?" + new URLSearchParams({ code: state.code, run: state.run }));
  const data = await response.json();
  if (!response.ok) { $("status").textContent = "✗ " + data.error; return; }
  state.skeleton = data;
  state.roots = data.roots;
  state.saved = data.saved;
  state.overrides = {};
  state.att = {};
  state.selected = "";
  state.renderedFor = "";
  // 换代码／换批次＝链尾那一行可能已经不在了：先退回整图，再由 boot 按 ?chain= 重新进（下面那个）。
  state.chain = "";
  state.trail = [];
  showChainView(false);
  state.run = data.run_id;
  bandKey = "\u0000";   // 换批次＝骨架换了，强迫下一次合成都算成「形状变了」而重画
  $("panel-link").href = `/panel?code=${data.code}&run=${data.run_id}`;
  document.title = `推导关系图 · ${data.ticker.name || data.code}`;
  // 骨架一到就先把下拉摆上，不必等第一次重算回来——那时下拉还空着，像没加载出来。
  renderErpWindow($("erpwindow"), data.erp_windows, state.overrides.erp);
  syncBenchmark(data);   // 基准下拉跟着这一批走：图上的 β 与 ERP 都是相对它测的
  compose(null);
  draw();
  renderDetail(true);
  await recompute();
  syncUrl();   // 地址栏跟着当前批次走：换批次后 ?chain= 若还留着旧链尾，reload 就画错一条链
}

// ---------------------------------------------------------------- 启动
// 代码列表、基准下拉、新鲜度判断、起作业与轮询都在 common.js 的「取数台」里，与面板共用一份；
// 这一页只交回 reload：作业跑完把新的骨架重画成图。

function fillRuns() {
  const runs = (entryFor(state.code) || {}).runs || [];
  $("run").innerHTML = runs.length
    ? runs.map((r) => `<option value="${r.run_id}">${r.run_id} · 截至 ${r.as_of}${r.edited ? " · 已修正" : ""}</option>`).join("")
    : '<option value="">（无批次）</option>';
  state.run = runs.length ? runs[0].run_id : "";
}

async function boot() {
  stickHeader();
  enablePan($("graph-scroll"));
  configureFetchDesk({ reload: async () => { await loadGraph(); } });
  const params = new URLSearchParams(location.search);
  await refreshOptions();
  state.code = (params.get("code") || "").replace(/[^0-9]/g, "").slice(0, 6) || (options.codes[0] || {}).code || "";
  $("code").value = state.code;
  fillRuns();
  const pinned = (params.get("run") || "").trim();
  if (pinned && (entryFor(state.code) || {}).runs?.some((r) => r.run_id === pinned)) { state.run = pinned; $("run").value = pinned; }
  await loadGraph();
  await showFreshness();   // 顶栏那一行先说清「这批还作不作数／换这个基准联不联网」，按钮才不像坏了
  bindFetchControls();
  // 深链：/derivation?code=..&run=..&chain=<key> 直接摊开那一行的来路（放大页可分享、可收藏）。
  // 认不出的 key 就留在整图——openChain 自己会挡，不必在这里再判一遍。
  const magnified = (params.get("chain") || "").trim();
  if (magnified && state.nodes[magnified]) openChain(magnified); else syncUrl();
  $("code").addEventListener("change", async () => { state.code = typedCode(); $("code").value = state.code; fillRuns(); await loadGraph(); await showFreshness(); });
  $("run").addEventListener("change", async () => { state.run = $("run").value; await loadGraph(); await showFreshness(); });
  // 浮层的三条退路指向同一个 closeChain：Esc、点浮层外的暗处、顶上那个返回按钮。少一条都会让人觉得被困住了。
  document.addEventListener("keydown", (event) => { if (event.key === "Escape" && state.chain) closeChain(); });
  $("chain-overlay").addEventListener("click", (event) => { if (event.target.id === "chain-overlay") closeChain(); });
  for (const id of ["method", "terminal"]) $(id).addEventListener("change", () => recompute());
  // 下拉就是「erp 那一行」的快捷输入：选中一档＝把它的实测数写进 state.overrides.erp，
  // 选回「级联所取」＝删掉这个键（＝退回机器基线）。与侧栏改那一行、面板改那个框同一份修正。
  $("erpwindow").addEventListener("change", (event) => {
    const raw = event.target.value;
    if (raw === "custom") return;
    write("erp", raw === "" ? undefined : Number(raw));
  });
  $("rate").addEventListener("input", schedule);
  $("zoom").addEventListener("change", draw);
  // 缩放选「适配窗口」时尺寸跟着容器走：窗口一窄就该重算倍率，否则图会一直按旧高度摆。
  // 浮层里那张小图的栏宽也是量出来的，同一件事得跟着重画一次，不然窄下去就多一条横向滚动条。
  window.addEventListener("resize", () => {
    if ($("zoom").value === "fit") draw();
    if (state.chain) renderChain();
  });
  $("reset").addEventListener("click", () => { state.overrides = {}; applyOverrides(); });
  $("save").addEventListener("click", async () => {
    const body = {
      code: state.code, run: state.run, overrides: state.overrides,
      method: $("method").value, terminal: $("terminal").value,
      rate: $("rate").value.trim(), per_share: state.data?.attribution.per_share,
    };
    const response = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const result = await response.json();
    $("status").textContent = response.ok ? "✓ 已保存 " + result.saved : "✗ " + result.error;
    if (response.ok) {
      await refreshOptions();
      state.saved = (await (await fetch("/api/derivation?" + new URLSearchParams({ code: state.code, run: state.run }))).json()).saved;
      renderNotices({ saved: state.saved, attribution: state.data.attribution, warnings: state.data.warnings });
    }
  });
  $("legend").innerHTML = [
    `<span><span class="swatch" style="background:#fff;border-color:var(--accent);border-style:dashed"></span>级联结果：改上游就重算</span>`,
    `<span><span class="swatch" style="background:#fff;border-color:#dc2626;border-style:dashed"></span>估值步骤：引擎算出的最后几跳，只读不改</span>`,
    `<span><span class="swatch" style="background:#fff8e6;border-color:#c2410c"></span>本次改过</span>`,
    `<span><span class="swatch" style="background:#f7f8fa"></span>参考行／不进定价</span>`,
    `<span>左边框色＝假设组（收入·盈利·再投资·资本结构·折现率·终值·市场）</span>`,
    `<span>栏＝离原始取数几步；一栏超过 ${MAX_STACK} 行就拆成并排的两栏，所以整图往右铺——按住图拖动即可平移，点节点看它的完整公式与逐年明细</span>`,
    `<span>改这里＝改面板：同一份 manual.json，±% 只在这台浏览器里换算成绝对值</span>`,
    `<span>侧栏「⤢ 放大这条链」＝弹出一张浮层，里面只画这一行与它上游两层：上面是这条链的小图，下面逐行给符号式与代入式（只读）。整图在背后原地不动</span>`,
    `<span class="muted">基线文件 ${esc(state.data?.baseline || "")}　报表截至 ${esc(state.data?.as_of || "")}</span>`,
  ].join("");
}

boot();
</script>
</body>
</html>
